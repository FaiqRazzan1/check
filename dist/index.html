<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Compliance Checker</title>
<meta name="description" content="Cek 8 kriteria kepatuhan halaman web + mobile-responsive — 100% = PASS">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<main class="max-w-4xl mx-auto p-4 sm:p-6">
<h1 class="text-xl sm:text-2xl font-bold">🛡️ Website Compliance Checker</h1>
<p class="text-sm text-slate-400 mt-1">9 kriteria • ~11,1% per cek • 100% = <b class="text-green-400">PASS</b>, &lt;100% = <b class="text-red-400">FAIL</b> (termasuk 📱 mobile). Tanpa backend — untuk situs beda origin, aktifkan CORS proxy di bawah.</p>
<div class="mt-4 flex flex-col sm:flex-row gap-2">
<input id="url" placeholder="https://contoh.com" class="flex-1 rounded-lg bg-slate-900 border border-slate-700 px-4 py-3 outline-none">
<button onclick="cek()" id="btn" class="rounded-lg bg-emerald-500 text-slate-950 font-semibold px-6 py-3">Cek Sekarang</button>
</div>
<div class="mt-2 text-sm text-slate-500">Contoh: <button class="underline" onclick="document.getElementById('url').value='https://example.com'">https://example.com</button> • <button class="underline" onclick="document.getElementById('url').value='https://wikipedia.org'">https://wikipedia.org</button></div>
<label class="text-xs text-slate-500 mt-2 block"><input type="checkbox" id="proxy" checked> pakai CORS proxy (api.allorigins.win) bila fetch langsung diblokir</label>
<p id="prog" class="mt-3 text-amber-300"></p>
<div id="out" class="mt-4"></div>
</main>
<script>
function norm(u){u=(u||'').trim();if(!u)throw new Error('URL kosong');if(!/^https?:\/\//i.test(u))u='https://'+u;return u;}
async function fetchText(url,useProxy){
  const target=useProxy?'https://api.allorigins.win/raw?url='+encodeURIComponent(url):url;
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),15000);
  try{const r=await fetch(target,{signal:ctrl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
  finally{clearTimeout(t);}
}
const PATS={about:/about|tentang/i,dmca:/dmca/i,contact:/contact|hubungi|kontak/i,tos:/terms|tos|syarat|ketentuan/i,privacy:/privacy|privasi|kebijakan/i};
const FIX={
  logo:'Tambahkan logo di <header> dengan alt tidak kosong: <code>&lt;a href="/"&gt;&lt;img src="/logo.png" alt="NamaBrand Logo"&gt;&lt;/a&gt;</code>',
  favicon:'Tambahkan di <code>&lt;head&gt;</code>: <code>&lt;link rel="icon" href="/favicon.ico" type="image/x-icon"&gt;</code>',
  about:'Tambahkan link: <code>&lt;a href="/about"&gt;About Us&lt;/a&gt;</code>',
  dmca:'Tambahkan link: <code>&lt;a href="/dmca"&gt;DMCA&lt;/a&gt;</code>',
  contact:'Tambahkan link: <code>&lt;a href="/contact"&gt;Contact Us&lt;/a&gt;</code>',
  tos:'Tambahkan link: <code>&lt;a href="/terms"&gt;Terms of Service&lt;/a&gt;</code>',
  privacy:'Tambahkan link: <code>&lt;a href="/privacy"&gt;Privacy Policy&lt;/a&gt;</code>',
  logohome:'Bungkus logo: <code>&lt;a href="/"&gt;...logo...&lt;/a&gt;</code>',
  mobile:'Tambahkan di <code>&lt;head&gt;</code>: <code>&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</code> + di CSS: <code>@media (max-width:768px){...}</code>'
};
function findLink(links,rx){
  return [...links].find(a=>rx.test(a.textContent||'')||rx.test(a.getAttribute('href')||''));
}
// Samakan dengan mesin Next.js: href fragment (#...), javascript:, atau kosong = TIDAK VALID
function validHref(h){
  h=(h||'').trim();
  if(!h) return false;
  if(h.startsWith('#')) return false;
  if(h.toLowerCase().startsWith('javascript:')) return false;
  return true;
}
async function cek(){
  const prog=document.getElementById('prog'),out=document.getElementById('out');
  out.innerHTML='';prog.textContent='Mengambil HTML...';
  try{
    const raw=norm(document.getElementById('url').value);
    const useProxy=document.getElementById('proxy').checked;
    let html='';
    try{html=await fetchText(raw,false);}catch(e){ if(!useProxy)throw e; prog.textContent='Fetch langsung diblokir CORS, coba via proxy...'; html=await fetchText(raw,true);}
    prog.textContent='Mengecek logo... favicon... footer...';
    const doc=new DOMParser().parseFromString(html,'text/html');
    const checks=[];
    const logo=doc.querySelector('header img, a > img, img[class*="logo" i], [class*="logo" i] img')||[...doc.querySelectorAll('img')].find(i=>((i.src||'')+(i.alt||'')).toLowerCase().includes('logo'));
    checks.push({no:1,key:'logo',kriteria:'Logo terlihat (alt tidak kosong)',status:logo&&((logo.alt||'').trim()!=='')?'PASS':'FAIL',bukti:logo?`src=${logo.getAttribute('src')} alt=${logo.getAttribute('alt')}`:'tidak ditemukan'});
    const fav=doc.querySelector('link[rel*="icon" i]');
    checks.push({no:2,key:'favicon',kriteria:'Favicon',status:fav?'PASS':'FAIL',bukti:fav?fav.getAttribute('href'):'tidak ada link[rel*=icon] (fallback /favicon.ico belum dicek fetch)'});
    const links=doc.querySelectorAll('a');
    [['about','About Us',3],['dmca','DMCA',4],['contact','Contact Us',5],['tos','ToS',6],['privacy','Privacy Policy',7]].forEach(([k,label,no])=>{
      const m=findLink(links,PATS[k]);
      const h=(m?(m.getAttribute('href')||''):'').trim();
      if(m&&validHref(h)){
        checks.push({no,key:k,kriteria:label,status:'PASS',bukti:`${m.textContent.trim()} -> ${h}`});
      }else{
        checks.push({no,key:k,kriteria:label,status:'FAIL',bukti:m?`teks="${(m.textContent||'').trim()}" href="${h}" tapi href tidak valid (fragment/kosong)`:'tidak ditemukan'});
      }
    });
    const logoA=logo?logo.closest('a'):null;
    const href=(logoA?logoA.getAttribute('href'):'')||'';
    // BUGFIX: bandingkan dengan hostname SITUS TARGET (raw), bukan alamat halaman checker ini
    let homePass=false;
    if(logoA){
      if(href===''||href==='/'||href==='./') homePass=true;
      else if(!href.startsWith('#')&&!href.toLowerCase().startsWith('javascript')){
        try{
          const u=new URL(href,raw);
          const tHost=new URL(raw).hostname;
          homePass=u.hostname===tHost&&(u.pathname==='/'||u.pathname===''||u.href===raw);
        }catch(e){ homePass=false; }
      }
    }
    checks.push({no:8,key:'logohome',kriteria:'Logo → Home',status:homePass?'PASS':'FAIL',bukti:logoA?`href=${href}`:'tanpa parent <a>'});
    // ---- 9. MOBILE RESPONSIVE (info, tidak memengaruhi skor 8 cek) ----
    prog.textContent='Mengecek mobile-responsive...';
    const vpEl=doc.querySelector('meta[name="viewport"]');
    const vp=vpEl?(vpEl.getAttribute('content')||''):'';
    const vpOk=/width\s*=\s*device-width/i.test(vp||'');
    let cssText='';doc.querySelectorAll('style').forEach(s=>cssText+=s.textContent||'');
    const mediaCount=(cssText.match(/@media[^{]*\((max|min)-width/gi)||[]).length;
    const hints=[];
    if(/(sm:|md:|lg:|grid-cols-|flex-col md:flex-row)/.test(html))hints.push('Tailwind responsif');
    if(/(col-(xs|sm|md|lg)-|navbar-toggler|container-fluid)/.test(html))hints.push('Bootstrap responsif');
    if(/max-width\s*:\s*100%/.test(cssText))hints.push('fluid max-width:100%');
    const bigFixed=(html.match(/width\s*:\s*(\d{3,4})px/gi)||[]).filter(w=>parseInt(w.replace(/\D/g,''),10)>=768);
    const mobPass=vpOk&&(mediaCount>0||hints.length>0);
    const mobBukti=`viewport=${vpOk?'"'+vp+'"':'(tidak ada)'} | @media=${mediaCount} | pola=[${hints.join('; ')||'-'}]${bigFixed.length?` | ⚠ ${bigFixed.length} lebar fix ≥768px`:''}`;
    checks.push({no:9,key:'mobile',kriteria:'Mobile-responsive',status:mobPass?'PASS':'FAIL',bukti:mobBukti});
    const fails=checks.filter(c=>c.status==='FAIL');
    const passed=checks.filter(c=>c.status==='PASS').length;
    const score=Math.round((passed*100)/9); // 9 cek gabung, @~11,11%
    const status=score===100?'PASS':'FAIL';
    out.innerHTML=`<div class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
      <div class="text-3xl sm:text-4xl font-bold ${status==='PASS'?'text-green-400':'text-red-400'}">${score}% <span class="text-base">${status}</span></div>
      <div class="overflow-x-auto -mx-1 px-1"><table class="w-full min-w-[520px] text-xs sm:text-sm mt-3"><thead><tr class="text-left text-slate-500 text-xs"><th class="p-2">No</th><th class="p-2">Kriteria</th><th class="p-2">Status</th><th class="p-2">Bukti</th></tr></thead><tbody>${checks.map(c=>`<tr class="border-t border-slate-800"><td class="p-2">${c.no}</td><td class="p-2">${c.kriteria}</td><td class="p-2">${c.status==='PASS'?'✅ PASS':'❌ FAIL'}</td><td class="p-2 text-xs text-slate-400 break-words">${c.bukti}</td></tr>`).join('')}</tbody></table></div>
      ${fails.length?`<div class="mt-3 rounded-xl border border-red-800 bg-red-950/40 p-3 break-words"><b class="text-red-300">🔧 Yang Harus Diperbaiki (${fails.length})</b>${fails.map(f=>`<div class="mt-2 text-sm"><b>#${f.no} ${f.kriteria}</b><br><span class="text-xs text-slate-400">${FIX[f.key]||''}</span></div>`).join('')}</div>`:''}
      <div class="mt-3 rounded-xl p-3 text-sm break-words ${mobPass?'bg-emerald-950 border border-emerald-800':'bg-amber-950 border border-amber-800'}">📱 Mobile-Responsive: <b>${mobPass?'✅ YA':'❌ BELUM'}</b> (cek #9, masuk skor)<br><span class="text-xs text-slate-400">${mobBukti}</span>${mobPass?'':'<br><span class="text-xs">Lihat cara perbaiki di panel 🔧 di atas. Tes manual: DevTools → Toggle device toolbar (Ctrl+Shift+M), cek 360×640 tanpa scroll horizontal.</span>'}</div>
      <p class="text-xs text-slate-500 mt-2">Catatan: versi file-tunggal ini cek keberadaan link/teks saja (tanpa validasi HTTP 200/soft-404 lintas origin). Untuk audit akurat + tes visual HP Playwright, pakai versi Next.js (<code>npm install && npm run dev</code>).</p>
      <div class="mt-2 flex flex-wrap gap-2"><button onclick='navigator.clipboard.writeText(document.getElementById("url").value)' class="rounded bg-slate-700 px-3 py-1 text-xs">Copy URL</button><button onclick="window.print()" class="rounded bg-slate-700 px-3 py-1 text-xs">PDF / Print</button></div>
    </div>`;
    prog.textContent='';
  }catch(e){prog.textContent='❌ '+e.message;}
}
</script>
</body>
</html>
